plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = 'autogamble' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
test { useJUnitPlatform() }

// Keep earlier releases outside build/, so Gradle clean cannot delete the archive.
def archivePreviousReleases = tasks.register('archivePreviousReleases') {
    doLast {
        def libs = layout.buildDirectory.dir('libs').get().asFile
        def archiveRoot = layout.projectDirectory.dir('releases/archive').asFile.toPath().toAbsolutePath().normalize()
        if (libs.isDirectory()) {
            libs.listFiles().findAll { it.isFile() }.each { artifact ->
                def match = artifact.name =~ /^autogamble-(\d+\.\d+\.\d+(?:-[A-Za-z0-9.]+)?)(-sources)?\.jar$/
                if (match.matches()) {
                    // Strip the optional source suffix before comparing versions.
                    def artifactVersion = artifact.name.substring('autogamble-'.length()).replaceFirst(/(?:-sources)?\.jar$/, '')
                    if (artifactVersion != project.version.toString()) {
                        def destination = archiveRoot.resolve(artifactVersion).resolve(artifact.name).normalize()
                        if (!destination.startsWith(archiveRoot)) throw new GradleException('Invalid archive path')
                        java.nio.file.Files.createDirectories(destination.parent)
                        if (java.nio.file.Files.exists(destination)) {
                            if (java.nio.file.Files.mismatch(artifact.toPath(), destination) != -1L)
                                throw new GradleException("Archive already contains a different ${artifact.name}; preserving both files")
                            java.nio.file.Files.delete(artifact.toPath())
                        } else {
                            java.nio.file.Files.move(artifact.toPath(), destination)
                        }
                    }
                }
            }
        }
    }
}
tasks.named('jar') { dependsOn archivePreviousReleases }
tasks.named('sourcesJar') { dependsOn archivePreviousReleases }
tasks.named('clean') { dependsOn archivePreviousReleases }
